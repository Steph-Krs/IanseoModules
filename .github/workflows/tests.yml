# Test bench of the modules (tests/README.md), run by GitHub on every pull request,
# every push, and once a week even when nothing changes: ianseo publishes releases on
# its own schedule, and the weekly run tells whether a new one breaks a module.
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Read-only token, no secret: a run can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ianseo core (official package + core update)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      day: ${{ steps.day.outputs.day }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # At most one download a day from ianseo.net, whatever the number of runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.cache
          key: ianseo-core-${{ hashFiles('tests/lib/bench.php') }}-${{ steps.day.outputs.day }}
      - name: Download and update the ianseo core
        run: |
          mkdir -p tests/.cache
          docker compose -f tests/docker/compose.yml build --quiet bench
          docker compose -f tests/docker/compose.yml run --rm bench bin/core.php
          docker compose -f tests/docker/compose.yml down --volumes

  check:
    name: modules on ${{ matrix.db }}
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [mariadb-10.11, mariadb-11.4, mysql-8.0, mysql-8.4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.cache
          key: ianseo-core-${{ hashFiles('tests/lib/bench.php') }}-${{ needs.core.outputs.day }}
          fail-on-cache-miss: true
      - name: Check the modules
        run: sh tests/run.sh --db ${{ matrix.db }}
