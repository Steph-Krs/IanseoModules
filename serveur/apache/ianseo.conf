# /etc/apache2/sites-available/ianseo.conf — vhost HTTP (port 80).
#
# Ne sert qu'à rediriger vers HTTPS. Aucun contenu n'est servi en clair : le
# module transporte des identifiants fédéraux, le HTTPS n'est pas négociable.
#
# Remplacer VOTRE-DOMAINE par le nom d'hôte réel avant activation.
#
#   sudo a2ensite ianseo && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName VOTRE-DOMAINE

    # Laisser passer le renouvellement Let's Encrypt (challenge HTTP-01) AVANT
    # la redirection, sinon certbot ne peut plus renouveler le certificat.
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>

    RedirectMatch permanent ^/(?!\.well-known/acme-challenge)(.*)$ https://VOTRE-DOMAINE/$1
</VirtualHost>
