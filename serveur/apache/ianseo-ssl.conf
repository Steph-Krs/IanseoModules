# /etc/apache2/sites-available/ianseo-ssl.conf — vhost HTTPS durci.
#
# Remplacer VOTRE-DOMAINE partout avant activation.
# Modules requis : a2enmod ssl rewrite headers
#
#   sudo a2ensite ianseo-ssl && sudo systemctl reload apache2
#
# Si le certificat est posé par certbot --apache, celui-ci crée son propre
# fichier « -le-ssl.conf » : dans ce cas, reprendre les blocs ci-dessous dedans
# plutôt que d'activer deux vhosts concurrents sur le même nom.

<VirtualHost *:443>
    ServerName VOTRE-DOMAINE
    DocumentRoot /var/www/ianseo

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/VOTRE-DOMAINE/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/VOTRE-DOMAINE/privkey.pem
    # TLS moderne (profil Mozilla « intermediate »)
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    ServerSignature Off

    # ---------------------------------------------------------------
    # MODE MAINTENANCE
    # ---------------------------------------------------------------
    # Tant que /var/www/maintenance.flag existe, tout visiteur reçoit un 503 et
    # la page de maintenance. C'est APACHE qui bloque : les scripts se
    # contentent de poser/retirer le drapeau (bin/ianseo-maintenance-on|off).
    #
    # Le 503 est le bon code : il dit aux moteurs de recherche « revenez plus
    # tard » sans déréférencer le site, contrairement à un 404 ou une redirection.
    #
    # ⚠️ Ce bloc doit rester AVANT les autres <Directory>, et 127.0.0.1 est
    # exclu pour que l'administrateur (et les scripts locaux) gardent la main
    # pendant la fenêtre.
    Alias /maintenance /var/www/maintenance
    <Directory /var/www/maintenance>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond /var/www/maintenance.flag -f
    RewriteCond %{REMOTE_ADDR} !=127.0.0.1
    RewriteCond %{REQUEST_URI} !^/maintenance/
    RewriteRule ^ /maintenance/index.html [L,R=503]
    ErrorDocument 503 /maintenance/index.html

    # ---------------------------------------------------------------
    # Racine
    # ---------------------------------------------------------------
    <Directory /var/www/ianseo>
        Options -Indexes -Includes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    # Fichiers sensibles jamais servis (config locale du module, sauvegardes,
    # journaux, dumps SQL…). config.local.json contient des identifiants.
    <FilesMatch "\.(inc\.php|json|md|bak|sql|log)$">
        Require all denied
    </FilesMatch>

    # AUCUNE exécution PHP dans les dossiers de fichiers téléversés : c'est la
    # protection décisive contre le dépôt d'un webshell via un import.
    <Directory /var/www/ianseo/TourData>
        php_admin_flag engine off
        <FilesMatch "\.ph(p[0-9]?|tml|ar)$"> Require all denied </FilesMatch>
    </Directory>
    <Directory /var/www/ianseo/Images>
        php_admin_flag engine off
    </Directory>
    <Directory /var/www/ianseo/TV>
        php_admin_flag engine off
        <FilesMatch "\.ph(p[0-9]?|tml|ar)$"> Require all denied </FilesMatch>
    </Directory>
    # (avec PHP-FPM, « php_admin_flag » est sans effet : utiliser à la place
    #  <FilesMatch "\.php$"> SetHandler none </FilesMatch> dans ces dossiers.)

    # ---------------------------------------------------------------
    # Outils d'administration serveur — accès restreint
    # ---------------------------------------------------------------
    # Le module AUTH les réserve déjà aux administrateurs ; on double au niveau
    # Apache. Ajouter au besoin les plages d'administration (LAN, VPN) après
    # 127.0.0.1 ::1 — ne JAMAIS les ouvrir largement.
    <Location "/Install"> Require ip 127.0.0.1 ::1 </Location>
    <Location "/Update">  Require ip 127.0.0.1 ::1 </Location>
    <Location "/Modules/Help/RepairTables.php"> Require ip 127.0.0.1 ::1 </Location>
    <Files "RepairXAMPP.php"> Require ip 127.0.0.1 ::1 </Files>
    # (RepairXAMPP.php est un script XAMPP/Windows sans objet sous Linux :
    #  le SUPPRIMER est encore mieux que le restreindre.)
    # Si phpMyAdmin est installé sur la machine : ne pas l'exposer
    # (le retirer, ou Require ip 127.0.0.1 + tunnel SSH pour l'utiliser).

    # ---------------------------------------------------------------
    # En-têtes de sécurité
    # ---------------------------------------------------------------
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</VirtualHost>
