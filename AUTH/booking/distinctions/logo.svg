<?xml version="1.0" encoding="UTF-8"?>
<!--
  Archer pictogram shared by every distinction badge.

  The archer and the bow are the federation logo, traced from its vector version.
  The cam (compound badges only) is drawn from the badge pictures.

  Drawn in a box about 107 x 126; each badge template places it with a transform
  on its <g id="logo"> slot. Only the shapes live here: their colours come from
  the badge (looks.json sets fill, stroke and display on the ids below).

  ids read by the badge renderer:
    pictogram  the whole drawing (copied into the template)
    ink        the archer: arm, hook, body
    bow        the bow
    cam        the cam, shown on compound badges only

  The fills below only make this file readable on its own (open it in a browser
  or in Inkscape); the badge overrides them.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -2 112 130" width="336" height="390">
  <g id="pictogram" stroke-linejoin="round">
    <g id="ink" fill="#2b2f7e" stroke="#9aa0a7" stroke-width="0.9">
      <path id="hook" d="M25.3,42.14 C25.3,42.14 25.24,46.63 28.73,46.81 C47.62,47.73 40.07,65.36 40.07,65.36 C40.07,65.36 59.6,42.14 25.3,42.14 Z"/>
      <path id="arm" d="M35.01,65.36 C35.01,65.36 6.94,62.58 6.94,69.01 C6.94,73.71 15.59,83.92 15.59,83.92 C15.59,83.92 -3.84,74.54 -3.84,63.78 C-3.84,56.08 35.01,65.36 35.01,65.36 Z"/>
      <path id="body" d="M102.95,70 C102.95,70 102.95,65.39 68.96,65.39 C39.87,65.39 35.03,72.76 44.71,82.02 C44.71,82.02 45.68,68.15 102.95,70 Z"/>
    </g>
    <g id="bow" fill="#d8352a" stroke="#9aa0a7" stroke-width="0.9">
      <path d="M78.55,125.6 L80.69,125.6 C89.33,111.19 99.07,88.86 99.07,70.02 C99.07,42.09 77.68,6.49 70.18,0.41 L68.97,0.41 C72.71,5.3 93.24,29.81 93.24,70.02 C93.24,94.83 85.42,113.66 78.55,125.6 Z"/>
    </g>
