# /etc/needrestart/conf.d/ianseo.conf — needrestart LISTS, it never restarts anything by itself.
#
# After each installation of packages, needrestart finds the services that still run an old copy
# of an updated program (Apache keeping the previous PHP in memory, for instance). By default it
# offers or does their restart on the spot — in the daytime too, for an update caught up after
# the server was switched on. Here it only lists them: ianseo-restart-services restarts them at
# night (04:40, /etc/cron.d/ianseo-restart).
#
#   sudo install -D -m 0644 ianseo.conf /etc/needrestart/conf.d/ianseo.conf
#   sudo apt install needrestart     # AFTER the setting: its first run then asks nothing

$nrconf{restart} = 'l';
