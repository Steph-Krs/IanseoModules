# /etc/fail2ban/filter.d/ianseo-auth.conf
#
#   sudo install -m 0644 -o root -g root filter-ianseo-auth.conf \
#        /etc/fail2ban/filter.d/ianseo-auth.conf
#
# Reconnaît les lignes écrites par le module dans /var/log/ianseo-auth.log
# (activé par config.local.json → "log_file"). Format produit par aut_log() :
#   2026-08-31 03:14:59 ianseo-auth 203.0.113.7 identifiant LOGIN_FAIL
#
# Vérification après installation :
#   sudo fail2ban-regex /var/log/ianseo-auth.log /etc/fail2ban/filter.d/ianseo-auth.conf

[Definition]
failregex = ^.* ianseo-auth <HOST> \S* (LOGIN_FAIL|TOTP_FAIL|LOGIN_BLOCK)$
ignoreregex =
