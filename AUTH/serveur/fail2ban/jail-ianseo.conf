# /etc/fail2ban/jail.d/ianseo.conf
#
#   sudo install -m 0644 -o root -g root jail-ianseo.conf /etc/fail2ban/jail.d/ianseo.conf
#   sudo systemctl restart fail2ban && sudo fail2ban-client status ianseo-auth
#
# Two COMPLEMENTARY barriers, not to be confused:
#   - the module already blocks at the 8th failure over 15 min (per identifier AND per IP),
#     but at the application level: the request still reaches PHP;
#   - fail2ban bans the IP at the NETWORK level beyond that, which cuts the traffic upstream
#     and also protects against distributed noise.
# Hence a maxretry above the application threshold: fail2ban must only trigger on obvious
# persistence, not on a user who makes a mistake.

[ianseo-auth]
enabled  = true
port     = http,https
filter   = ianseo-auth
logpath  = /var/log/ianseo-auth.log
maxretry = 10
findtime = 15m
bantime  = 1h
