# /etc/fail2ban/jail.d/ianseo.conf
#
#   sudo install -m 0644 -o root -g root jail-ianseo.conf /etc/fail2ban/jail.d/ianseo.conf
#   sudo systemctl restart fail2ban && sudo fail2ban-client status ianseo-auth
#
# Deux barrières COMPLÉMENTAIRES, à ne pas confondre :
#   - le module bloque déjà au 8ᵉ échec sur 15 min (par identifiant ET par IP),
#     mais au niveau applicatif : la requête arrive quand même jusqu'à PHP ;
#   - fail2ban bannit l'IP au niveau RÉSEAU au-delà, ce qui coupe le trafic en
#     amont et protège aussi contre le bruit distribué.
# D'où maxretry supérieur au seuil applicatif : fail2ban ne doit se déclencher
# que sur de l'acharnement manifeste, pas sur un utilisateur qui se trompe.

[ianseo-auth]
enabled  = true
port     = http,https
filter   = ianseo-auth
logpath  = /var/log/ianseo-auth.log
maxretry = 10
findtime = 15m
bantime  = 1h
