# /etc/apache2/sites-available/ianseo-ssl.conf — hardened HTTPS vhost.
#
# Replace YOUR-DOMAIN everywhere before activation.
# Modules required: a2enmod ssl rewrite headers
#
#   sudo a2ensite ianseo-ssl && sudo systemctl reload apache2
#
# When the certificate is set by certbot --apache, certbot creates its own "-le-ssl.conf"
# file: in that case, copy the blocks below into it rather than turning on two competing
# vhosts on the same name.

<VirtualHost *:443>
    ServerName YOUR-DOMAIN
    DocumentRoot /var/www/ianseo

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/YOUR-DOMAIN/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/YOUR-DOMAIN/privkey.pem
    # Modern TLS (Mozilla "intermediate" profile)
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    ServerSignature Off

    # ---------------------------------------------------------------
    # MAINTENANCE MODE
    # ---------------------------------------------------------------
    # While /var/www/maintenance.flag exists, every visitor receives a 503 and the maintenance
    # page. It is APACHE that blocks: the scripts only set/remove the flag
    # (bin/ianseo-maintenance-on|off).
    #
    # 503 is the right code: it tells search engines "come back later" without dropping the
    # site from their index, unlike a 404 or a redirection.
    #
    # ⚠️ This block must stay BEFORE the other <Directory> blocks, and 127.0.0.1 is left out so
    # that the administrator (and the local scripts) keep control during the window.
    Alias /maintenance /var/www/maintenance
    <Directory /var/www/maintenance>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond /var/www/maintenance.flag -f
    RewriteCond %{REMOTE_ADDR} !=127.0.0.1
    RewriteCond %{REQUEST_URI} !^/maintenance/
    RewriteRule ^ /maintenance/index.html [L,R=503]
    ErrorDocument 503 /maintenance/index.html

    # ---------------------------------------------------------------
    # Root
    # ---------------------------------------------------------------
    <Directory /var/www/ianseo>
        Options -Indexes -Includes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    # Sensitive files never served (local config of the module, backups, logs, SQL dumps…).
    # config.local.json holds credentials.
    <FilesMatch "\.(inc\.php|json|md|bak|sql|log)$">
        Require all denied
    </FilesMatch>

    # NO PHP execution in the folders of uploaded files: the decisive protection against a
    # webshell dropped through an import.
    <Directory /var/www/ianseo/TourData>
        php_admin_flag engine off
        <FilesMatch "\.ph(p[0-9]?|tml|ar)$"> Require all denied </FilesMatch>
    </Directory>
    <Directory /var/www/ianseo/Images>
        php_admin_flag engine off
    </Directory>
    <Directory /var/www/ianseo/TV>
        php_admin_flag engine off
        <FilesMatch "\.ph(p[0-9]?|tml|ar)$"> Require all denied </FilesMatch>
    </Directory>
    # (with PHP-FPM, "php_admin_flag" has no effect: use instead
    #  <FilesMatch "\.php$"> SetHandler none </FilesMatch> in these folders.)

    # ---------------------------------------------------------------
    # Server administration tools — restricted access
    # ---------------------------------------------------------------
    # The AUTH module already reserves them to the administrators; Apache doubles it. Add the
    # administration ranges (LAN, VPN) after 127.0.0.1 ::1 if needed — NEVER open them widely.
    <Location "/Install"> Require ip 127.0.0.1 ::1 </Location>
    <Location "/Update">  Require ip 127.0.0.1 ::1 </Location>
    <Location "/Modules/Help/RepairTables.php"> Require ip 127.0.0.1 ::1 </Location>
    <Files "RepairXAMPP.php"> Require ip 127.0.0.1 ::1 </Files>
    # (RepairXAMPP.php is an XAMPP/Windows script that makes no sense under Linux: DELETING it
    #  is even better than restricting it.)
    # When phpMyAdmin is installed on the machine: do not expose it
    # (remove it, or Require ip 127.0.0.1 + an SSH tunnel to use it).

    # ---------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</VirtualHost>
