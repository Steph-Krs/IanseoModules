# /etc/apache2/sites-available/ianseo.conf — HTTP vhost (port 80).
#
# Only redirects to HTTPS. No content is served in clear: the module carries federation
# credentials, HTTPS is not negotiable.
#
# Replace YOUR-DOMAIN with the real host name before activation.
#
#   sudo a2ensite ianseo && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName YOUR-DOMAIN

    # Let the Let's Encrypt renewal (HTTP-01 challenge) through BEFORE the redirection,
    # otherwise certbot can no longer renew the certificate.
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>

    RedirectMatch permanent ^/(?!\.well-known/acme-challenge)(.*)$ https://YOUR-DOMAIN/$1
</VirtualHost>
