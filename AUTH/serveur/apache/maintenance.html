<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Maintenance under way</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- The page reloads itself every 30 seconds -->
    <meta http-equiv="refresh" content="30">

    <style>
        :root {
            --blue: #0254a8;
            --blue-dark: #01367c;
            --blue-light: #a7d6ff;
            --background: #f0f4ff;
            --text: #20263d;
            --secondary: #4c4e50;
            --border: #d2d4d6;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at top left,
                    rgba(167, 214, 255, 0.65),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(2, 84, 168, 0.10),
                    transparent 40%
                ),
                var(--background);
        }

        /*
         * Main card
         */
        .maintenance-card {
            position: relative;

            width: 100%;
            max-width: 620px;
            padding: 48px 40px 36px;

            text-align: center;

            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);

            overflow: hidden;
        }

        /*
         * Top blue band
         */
        .maintenance-card::before {
            content: "";

            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 6px;

            background: var(--blue);
        }

        /*
         * Target
         */
        .target {
            position: relative;

            width: 112px;
            height: 112px;
            margin: 0 auto 28px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    var(--blue) 0 12%,
                    var(--white) 13% 27%,
                    var(--blue) 28% 43%,
                    var(--white) 44% 58%,
                    var(--blue-light) 59% 73%,
                    var(--white) 74% 100%
                );

            border: 1px solid var(--border);

            box-shadow:
                0 4px 14px rgba(2, 84, 168, 0.14);
        }

        /*
         * Arrow centred on the target
         */
        .arrow {
            position: absolute;

            /* Shifted by 55px (44px of half height + 11px of tip offset)
               so that the tip of the arrow lands exactly in the centre of the target */
            top: calc(0% + 10px);
            left: 0%;

            width: 6px;
            height: 88px;

            background: var(--text);

            border-radius: 4px;

            transform: rotate(90deg);
            transform-origin: center;

            animation: arrowVibration 2.8s ease-in-out infinite;
        }

        /*
         * Arrow tip
         */
        .arrow::before {
            content: "";

            position: absolute;

            top: -11px;
            left: 50%;

            width: 0;
            height: 0;

            transform: translateX(-50%);

            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 18px solid var(--text);
        }

        /*
         * Stylised fletching
         */
        .arrow::after {
            content: "";

            position: absolute;

            bottom: -8px;
            left: 50%;

            width: 22px;
            height: 14px;

            transform: translateX(-50%);

            border-top: 6px solid var(--blue);
            border-radius: 50%;
        }

        @keyframes arrowVibration {
            0%,
            100% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            50% {
                transform: translate(-50%, -50%) rotate(2deg);
            }
        }

        /*
         * Title
         */
        h1 {
            margin: 0 0 14px;

            color: var(--blue-dark);

            font-size: clamp(28px, 5vw, 40px);
            line-height: 1.15;
        }

        /*
         * Main message
         */
        .message {
            margin: 0;

            color: var(--secondary);

            font-size: 17px;
            line-height: 1.6;
        }

        /*
         * Waiting block
         */
        .waiting {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            margin-top: 32px;
            padding: 12px 20px;

            color: var(--blue-dark);
            font-size: 14px;
            font-weight: 600;

            background: var(--background);
            border: 1px solid var(--blue-light);
            border-radius: 6px;
        }

        /*
         * Three animated dots
         */
        .dots {
            display: inline-flex;
            gap: 6px;
        }

        .dots i {
            display: block;

            width: 8px;
            height: 8px;

            background: var(--blue);

            border-radius: 50%;
            opacity: 0.4;

            animation: dotBounce 1s ease-in-out infinite;
        }

        .dots i:nth-child(2) {
            animation-delay: 0.16s;
        }

        .dots i:nth-child(3) {
            animation-delay: 0.32s;
        }

        @keyframes dotBounce {
            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            40% {
                transform: translateY(-7px);
                opacity: 1;
            }
        }

        /*
         * Smooth change of the waiting message
         */
        #status-message {
            transition: opacity 0.3s ease;
        }

        #status-message.fade-out {
            opacity: 0;
        }

        /*
         * Information at the bottom of the card
         */
        .footer-info {
            margin-top: 30px;
            padding-top: 22px;

            color: var(--secondary);

            font-size: 13px;
            line-height: 1.5;

            border-top: 1px solid var(--border);
        }

        .refresh-info {
            margin-top: 8px;

            color: var(--blue);
            font-weight: 600;
        }

        /*
         * Reduced motion mode
         */
        @media (prefers-reduced-motion: reduce) {
            .arrow {
                animation: none;
            }

            .dots i {
                animation-name: dotFade;
            }

            #status-message {
                transition: none;
            }
        }

        @keyframes dotFade {
            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        /* ==========================================================
         * Archer scene (progressive enhancement of the static picture)
         * ========================================================== */
        .archery-scene {
            width: 100%;
            margin: 0 auto 28px;

            border-radius: 4px;
            overflow: hidden;
        }

        .archery-scene svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .flying-arrow-svg {
            transform-origin: 0 0;
            transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .flying-arrow-svg.fade-out-shot,
        .impact-mark-svg.fade-out-shot {
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        /*
         * Phones
         */
        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .maintenance-card {
                padding: 38px 24px 28px;
            }

            .target {
                transform: scale(0.88);
                margin-bottom: 20px;
            }

            .message {
                font-size: 16px;
            }

            .waiting {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="maintenance-card">

        <!-- Static target and arrow: fallback when JS is off or motion reduced -->
        <div class="target" id="staticTarget" aria-hidden="true">
            <div class="arrow"></div>
        </div>

        <!-- Animated archer scene: turned on in JS when animations are allowed -->
        <div class="archery-scene" id="archeryScene" aria-hidden="true" hidden>
            <svg id="archerySvg" viewBox="0 0 600 170" xmlns="http://www.w3.org/2000/svg">

        <!-- Animated waiting message -->
        <div class="waiting" aria-live="polite">
            <span id="status-message">Preparing the server</span>

            <span class="dots" aria-hidden="true">

            </span>
        </div>

        <!-- Information about the reload -->
        <div class="footer-info">
            <span id="mt-nothing">You have nothing to do: the page will update by itself.</span>

            <div class="refresh-info" id="mt-refresh">
                Next check in less than 30 seconds

    <script>
        /*
         * Archer scene: replaces the static target with a small animation where a
         * detailed archer, placed at random, shoots an end of 3 arrows towards random
         * points of the target, placed on the right (the archer therefore shoots to
         * the right).
         *
         * Follows prefers-reduced-motion: when the user prefers less motion, the
         * static target/arrow (already placed correctly) is kept and the scene is not
         * turned on.
         */
        (function () {
            var prefersReducedMotion =
                window.matchMedia &&
                window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            if (prefersReducedMotion) {
                return;
            }

            var staticTarget = document.getElementById("staticTarget");
            var scene = document.getElementById("archeryScene");
            var svgNS = "http://www.w3.org/2000/svg";
            var svg = document.getElementById("archerySvg");
            var miniTargetGroup = document.getElementById("miniTargetGroup");
            var archerGroup = document.getElementById("archerGroup");
            var shotsLayer = document.getElementById("shotsLayer");

            if (!scene || !svg || !miniTargetGroup || !archerGroup || !shotsLayer) {
                return;
            }

            // Switch from the static fallback to the animated scene.
            staticTarget.style.display = "none";
            scene.hidden = false;

            /* ----- Scene constants (SVG units) ----- */
            var GROUND_Y = 150;
            var TARGET_X = 528;
            var TARGET_CENTER_Y = 78;
            var TARGET_OUTER_R = 46;

            var ARCHER_X_MIN = 30;
            var ARCHER_X_MAX = 340;
            var ARCHER_SCALE = 0.5;

            // Landmarks of the archer, in local coordinates
            // (before scaling and mirroring).
            var GRIP_LOCAL = { x: -80, y: -150 };
            var DRAWN_HAND_LOCAL = { x: 34, y: -150 };
            var ARROW_VISUAL_LEN = 125;

            var STROKE = "#1c2233";

            function randomBetween(min, max) {
                return Math.random() * (max - min) + min;
            }

            /* ----- Target ----- */
            function buildTarget() {
                var rings = [
                    { r: TARGET_OUTER_R, fill: "var(--white)" },
                    { r: TARGET_OUTER_R * 0.8, fill: "var(--blue)" },
                    { r: TARGET_OUTER_R * 0.6, fill: "var(--white)" },
                    { r: TARGET_OUTER_R * 0.4, fill: "var(--blue-light)" },
                    { r: TARGET_OUTER_R * 0.2, fill: "var(--blue-dark)" }
                ];

                var html = "";
                rings.forEach(function (ring) {
                    html +=
                        '<circle cx="' + TARGET_X + '" cy="' + TARGET_CENTER_Y + '" r="' + ring.r +
                        '" fill="' + ring.fill + '" stroke="var(--border)" stroke-width="1"></circle>';
                });

                miniTargetGroup.innerHTML = html;
            }

            /*
             * Detailed archer, at full draw, arrow nocked.
             * Drawn in the "base" position (shooting to the left) then mirrored
             * horizontally to shoot to the right.
             */
            function archerTemplateSVG() {
                var hand = DRAWN_HAND_LOCAL;
                var dx = GRIP_LOCAL.x - hand.x;
                var dy = GRIP_LOCAL.y - hand.y;
                var len = Math.hypot(dx, dy) || 1;
                var ux = dx / len, uy = dy / len;

                var tailX = hand.x - ux * 12;
                var tailY = hand.y - uy * 12;
                var tipX = hand.x + ux * ARROW_VISUAL_LEN;
                var tipY = hand.y + uy * ARROW_VISUAL_LEN;

                return ''
                    // back leg
                    + '<path d="M 4,-78 L 24,-38 L 32,4" fill="none" stroke="' + STROKE + '" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>'
                    // front leg
                    + '<path d="M 4,-78 L -16,-40 L -22,4" fill="none" stroke="' + STROKE + '" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>'
                    // bow
                    + '<path d="M -70,-220 Q -100,-175 ' + GRIP_LOCAL.x + ',' + GRIP_LOCAL.y + ' Q -100,-125 -70,-80" fill="none" stroke="' + STROKE + '" stroke-width="7" stroke-linecap="round"/>'
                    // torso
                    + '<path d="M -4,-150 L 4,-78" fill="none" stroke="' + STROKE + '" stroke-width="21" stroke-linecap="round"/>'
                    // bow arm (holds the bow)
                    + '<path d="M -8,-146 L ' + GRIP_LOCAL.x + ',' + GRIP_LOCAL.y + '" fill="none" stroke="' + STROKE + '" stroke-width="13" stroke-linecap="round"/>'
                    // drawing arm (draws the string)
                    + '<path d="M 0,-142 L ' + hand.x + ',' + hand.y + '" fill="none" stroke="' + STROKE + '" stroke-width="13" stroke-linecap="round"/>'
                    // drawn string
                    + '<path d="M -70,-220 L ' + hand.x + ',' + hand.y + ' L -70,-80" fill="none" stroke="#d7d7d7" stroke-width="2.4"/>'
                    // nocked arrow
                    + '<line x1="' + tailX + '" y1="' + tailY + '" x2="' + tipX + '" y2="' + tipY + '" stroke="#5a3b23" stroke-width="3.2" stroke-linecap="round"/>'
                    + '<polygon points="' + tipX + ',' + tipY + ' ' +
                        (tipX - uy * 6 - ux * 12) + ',' + (tipY + ux * 6 - uy * 12) + ' ' +
                        (tipX + uy * 6 - ux * 12) + ',' + (tipY - ux * 6 - uy * 12) +
                        '" fill="' + STROKE + '"/>'
                    // head
                    + '<circle cx="-4" cy="-168" r="17" stroke="' + STROKE + '" stroke-width="6"/>';
            }

            function buildArcher() {
                archerGroup.innerHTML = archerTemplateSVG();
            }

            /*
             * Converts a point given in the local frame of the archer (before scaling /
             * mirroring) into scene coordinates, taking the random position of the
             * archer into account.
             */
            function localToScene(archerX, point) {
                return {
                    x: archerX - point.x * ARCHER_SCALE,
                    y: GROUND_Y + point.y * ARCHER_SCALE
                };
            }

            var state = { archerX: 80 };

            function repositionArcher() {
                state.archerX = randomBetween(ARCHER_X_MIN, ARCHER_X_MAX);
                archerGroup.setAttribute(
                    "transform",
                    "translate(" + state.archerX + "," + GROUND_Y + ") scale(" + (-ARCHER_SCALE) + "," + ARCHER_SCALE + ")"
                );
            }

            /*
             * Picks a random point inside the target (uniform distribution over the
             * disc).
             */
            function randomTargetPoint() {
                var maxRadius = TARGET_OUTER_R * 0.82;
                var angle = randomBetween(0, Math.PI * 2);
                var radius = Math.sqrt(Math.random()) * maxRadius;

                return {
                    x: TARGET_X + Math.cos(angle) * radius,
                    y: TARGET_CENTER_Y + Math.sin(angle) * radius
                };
            }

            function shootOneArrow() {
                var start = localToScene(state.archerX, GRIP_LOCAL);
                var end = randomTargetPoint();

                var dx = end.x - start.x;
                var dy = end.y - start.y;
                var angleDeg = (Math.atan2(dy, dx) * 180) / Math.PI;
                var fullDistance = Math.hypot(dx, dy);
                var arrowVisualLength = 24;
                var travelDistance = Math.max(0, fullDistance - arrowVisualLength);

                var arrowEl = document.createElementNS(svgNS, "g");
                arrowEl.setAttribute("class", "flying-arrow-svg");
                arrowEl.innerHTML =
                    '<line x1="0" y1="0" x2="18" y2="0" stroke="' + STROKE + '" stroke-width="3" stroke-linecap="round"/>' +
                    '<polygon points="24,0 14,-4 14,4" fill="' + STROKE + '"/>' +
                    '<polygon points="0,0 -8,-4 -8,4" fill="var(--blue)"/>';

                arrowEl.style.transform =
                    "translate(" + start.x + "px," + start.y + "px) rotate(" + angleDeg + "deg) translateX(0px)";
                shotsLayer.appendChild(arrowEl);

                // Lets the browser paint the initial state before
                // starting the transition to the impact point.
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        arrowEl.style.transform =
                            "translate(" + start.x + "px," + start.y + "px) rotate(" + angleDeg + "deg) translateX(" + travelDistance + "px)";
                    });
                });

                arrowEl.addEventListener(
                    "transitionend",
                    function () {
                        var impact = document.createElementNS(svgNS, "circle");
                        impact.setAttribute("class", "impact-mark-svg");
                        impact.setAttribute("cx", end.x);
                        impact.setAttribute("cy", end.y);
                        impact.setAttribute("r", "4.5");
                        impact.setAttribute("fill", "var(--blue-dark)");
                        impact.setAttribute("stroke", "var(--white)");
                        impact.setAttribute("stroke-width", "1.2");
                        shotsLayer.appendChild(impact);
                    },
                    { once: true }
                );
            }

            function clearShots(callback) {
                var shots = shotsLayer.querySelectorAll(".flying-arrow-svg, .impact-mark-svg");

                if (!shots.length) {
                    callback();
                    return;
                }

                shots.forEach(function (el) {
                    el.classList.add("fade-out-shot");
                });

                setTimeout(function () {
                    shotsLayer.innerHTML = "";
                    callback();
                }, 350);
            }

            /*
             * One end = 3 arrows shot from the same archer position, then clean-up
             * and a new position for the next end.
             */
            function runVolley() {
                repositionArcher();

                var arrowsShot = 0;
                var shotInterval = setInterval(function () {
                    shootOneArrow();
                    arrowsShot += 1;

                    if (arrowsShot >= 3) {
                        clearInterval(shotInterval);

                        setTimeout(function () {
                            clearShots(function () {
                                setTimeout(runVolley, 500);
                            });
                        }, 1400);
                    }
                }, 850);
            }

            buildTarget();
            buildArcher();
            runVolley();
        })();
    </script>

</body>
</html>
