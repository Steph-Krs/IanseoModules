# /etc/systemd/system/apt-daily.timer.d/ianseo.conf — DOWNLOAD of the updates.
#
# By default: twice a day, at a random time. Here: every night at 04:00, just before their
# installation (apt-daily-upgrade.timer.conf, 04:30). See SERVEUR.md § 4.1.
#
#   sudo install -D -m 0644 apt-daily.timer.conf /etc/systemd/system/apt-daily.timer.d/ianseo.conf
#   sudo systemctl daemon-reload
#   systemctl list-timers 'apt-daily*'      # the NEXT column must show 04:00
#
# The empty "OnCalendar=" line is required: it clears the original schedule, otherwise both
# would add up.

[Timer]
OnCalendar=
OnCalendar=*-*-* 04:00
RandomizedDelaySec=0
