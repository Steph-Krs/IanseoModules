# /etc/systemd/system/apt-daily.timer.d/ianseo.conf — TÉLÉCHARGEMENT des mises à jour.
#
# Par défaut : deux fois par jour, à une heure aléatoire. Ici : chaque nuit à 04:00, juste
# avant leur installation (apt-daily-upgrade.timer.conf, 04:30). Voir SERVEUR.md § 4.1.
#
#   sudo install -D -m 0644 apt-daily.timer.conf /etc/systemd/system/apt-daily.timer.d/ianseo.conf
#   sudo systemctl daemon-reload
#   systemctl list-timers 'apt-daily*'      # la colonne NEXT doit afficher 04:00
#
# La ligne « OnCalendar= » vide est indispensable : elle efface l'horaire d'origine,
# sans quoi les deux s'additionneraient.

[Timer]
OnCalendar=
OnCalendar=*-*-* 04:00
RandomizedDelaySec=0
