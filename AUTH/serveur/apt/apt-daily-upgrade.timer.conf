# /etc/systemd/system/apt-daily-upgrade.timer.d/ianseo.conf — INSTALLATION of the updates.
#
# By default around 6 am, with a random delay of one hour: the installation restarts the
# database and Apache on the way — in the middle of a competition on a Saturday morning. On
# another ianseo server, it happened three times in a semester, each time on a competition day.
#
# Here: every night at 04:30, AFTER the maintenance window of 03:15 (/etc/cron.d/ianseo-nightly)
# and never during it: a database restart during the backup would make it fail, and the core
# update would be skipped that night. If you move one, move the other.
#
# Persistent=false: an installation missed while the server was off is NOT caught up when it
# starts again, but waits for the next 04:30. Debian's default catches it up at once — on
# 2026-10-22, a test server switched on again at 13:52 after an outage of its internet box
# installed 13 packages at 13:53, PHP among them. For a server running day and night it costs
# nothing; a machine switched off every night would never update by itself (then remove the
# line, or install by hand: sudo unattended-upgrade).
#
#   sudo install -D -m 0644 apt-daily-upgrade.timer.conf /etc/systemd/system/apt-daily-upgrade.timer.d/ianseo.conf
#   sudo systemctl daemon-reload
#   systemctl list-timers 'apt-daily*'      # the NEXT column must show 04:30

[Timer]
OnCalendar=
OnCalendar=*-*-* 04:30
RandomizedDelaySec=0
Persistent=false
