# /etc/systemd/system/apt-daily-upgrade.timer.d/ianseo.conf — INSTALLATION des mises à jour.
#
# Par défaut vers 6 h, avec un délai aléatoire d'une heure : l'installation redémarre la
# base et Apache au passage — en pleine compétition un samedi matin. Sur un autre serveur
# ianseo, c'est arrivé trois fois en un semestre, chaque fois un jour de compétition.
#
# Ici : chaque nuit à 04:30, APRÈS la fenêtre de maintenance de 03:15 (/etc/cron.d/ianseo-nightly)
# et jamais pendant : un redémarrage de la base pendant la sauvegarde la ferait échouer, et la
# mise à jour du cœur serait sautée cette nuit-là. Si vous déplacez l'un, déplacez l'autre.
#
#   sudo install -D -m 0644 apt-daily-upgrade.timer.conf /etc/systemd/system/apt-daily-upgrade.timer.d/ianseo.conf
#   sudo systemctl daemon-reload
#   systemctl list-timers 'apt-daily*'      # la colonne NEXT doit afficher 04:30

[Timer]
OnCalendar=
OnCalendar=*-*-* 04:30
RandomizedDelaySec=0
