# Test bench: a throwaway database server and the PHP environment.
# Run it through tests/run.sh rather than by hand.
#
# DB_IMAGE chooses the database server (default: MariaDB 10.11). Images are pinned by
# digest; tests/run.sh lists the ones the bench is run against.
name: ianseo-modules-tests

services:
  db:
    image: ${DB_IMAGE:-mariadb:10.11@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20}
    environment:
      MARIADB_ROOT_PASSWORD: bench
      MYSQL_ROOT_PASSWORD: bench
    # Data in memory: the server starts empty on every run and leaves nothing behind.
    tmpfs:
      - /var/lib/mysql
    # No port published: only the bench container reaches this server.

  bench:
    # One image per PHP version (tests/run.sh --php), so that switching does not rebuild.
    image: ianseo-modules-bench:php${BENCH_PHP:-8.3}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.3-apache-bookworm@sha256:a14446c32a3c8aeb9b4dac7fb73b03dfd8006e670d9b43ea7947e4030d3cbae6}
    depends_on:
      - db
    environment:
      BENCH_DB_HOST: db
      BENCH_DB_PASS: bench
    volumes:
      # The repository, read-only: the bench works on copies and cannot change it.
      - ../..:/src:ro
      # Downloads and the updated core, kept between runs (ignored by git).
      - ../.cache:/cache
